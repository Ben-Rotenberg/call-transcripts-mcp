<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D28D9"/><stop offset=".55" stop-color="#DB2777"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker>
    <style>.box{fill:#fff;stroke:#CBD5E1;stroke-width:2}.t{font-size:19px;font-weight:700;fill:#0F172A}.s{font-size:14px;fill:#475569}.l{font-size:13px;fill:#334155}.ln{stroke:#64748B;stroke-width:2.5;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1100" height="520" rx="24" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1100" height="64" rx="24" fill="url(#g)"/><rect x="0" y="40" width="1100" height="24" fill="url(#g)"/>
  <text x="550" y="41" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">Call Transcripts MCP — how the pieces connect</text>

  <!-- phone -->
  <rect class="box" x="40" y="110" width="190" height="150" rx="18"/>
  <rect x="112" y="128" width="46" height="78" rx="9" fill="#111827"/><rect x="117" y="136" width="36" height="58" rx="4" fill="#A78BFA"/><circle cx="135" cy="200" r="2.5" fill="#fff"/>
  <text class="t" x="135" y="232" text-anchor="middle">Android phone</text>
  <text class="s" x="135" y="251" text-anchor="middle">Cube ACR records calls</text>

  <!-- drive -->
  <rect class="box" x="300" y="110" width="200" height="150" rx="18"/>
  <path d="M378 190l18-31h32l18 31z" fill="#FBBF24"/><path d="M378 190l16 0 16-27-16-4z" fill="#34D399"/><path d="M394 190h52l-16 0-36 0z" fill="#60A5FA"/><rect x="378" y="190" width="68" height="10" rx="3" fill="#60A5FA"/>
  <text class="t" x="400" y="232" text-anchor="middle">Google Drive</text>
  <text class="s" x="400" y="251" text-anchor="middle">"Cube ACR" folder</text>

  <!-- apps script -->
  <rect class="box" x="300" y="330" width="200" height="150" rx="18"/>
  <text x="400" y="402" text-anchor="middle" font-size="40" font-weight="800" fill="#2563EB">{ }</text>
  <text class="t" x="400" y="447" text-anchor="middle">Apps Script</text>
  <text class="s" x="400" y="466" text-anchor="middle">runs every 5 minutes</text>

  <!-- worker -->
  <rect x="580" y="200" width="250" height="200" rx="18" fill="#fff" stroke="#F97316" stroke-width="3"/>
  <text class="t" x="705" y="236" text-anchor="middle">Cloudflare Worker</text>
  <rect x="604" y="254" width="94" height="52" rx="10" fill="#FFEDD5"/><text class="l" x="651" y="277" text-anchor="middle" font-weight="700">KV</text><text class="l" x="651" y="295" text-anchor="middle">audio queue</text>
  <rect x="712" y="254" width="94" height="52" rx="10" fill="#FFEDD5"/><text class="l" x="759" y="277" text-anchor="middle" font-weight="700">D1</text><text class="l" x="759" y="295" text-anchor="middle">transcripts</text>
  <rect x="604" y="318" width="202" height="30" rx="8" fill="#FFF7ED"/><text class="l" x="705" y="338" text-anchor="middle">cron every 5 min · full-text search</text>
  <rect x="604" y="356" width="202" height="30" rx="8" fill="#FFF7ED"/><text class="l" x="705" y="376" text-anchor="middle">MCP endpoint /mcp/&lt;token&gt;</text>

  <!-- openai -->
  <rect class="box" x="600" y="70" width="210" height="96" rx="18"/>
  <circle cx="640" cy="118" r="20" fill="#10A37F"/><path d="M630 118h20M640 108v20" stroke="#fff" stroke-width="3"/>
  <text class="t" x="728" y="114" text-anchor="middle">OpenAI</text>
  <text class="s" x="728" y="134" text-anchor="middle">speech to text</text>

  <!-- claude -->
  <rect class="box" x="890" y="220" width="170" height="160" rx="18"/>
  <circle cx="975" cy="275" r="28" fill="#D97757"/><path d="M975 255v40M955 275h40M961 261l28 28M989 261l-28 28" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text class="t" x="975" y="333" text-anchor="middle">Claude</text>
  <text class="s" x="975" y="352" text-anchor="middle">custom connector</text>

  <!-- transcripts md -->
  <rect x="40" y="345" width="190" height="120" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="115" y="362" width="40" height="50" rx="5" fill="#E0E7FF"/><rect x="122" y="374" width="26" height="4" rx="2" fill="#6366F1"/><rect x="122" y="384" width="20" height="4" rx="2" fill="#6366F1"/><rect x="122" y="394" width="24" height="4" rx="2" fill="#6366F1"/>
  <text class="t" x="135" y="436" text-anchor="middle" font-size="16">.md transcripts</text>
  <text class="s" x="135" y="454" text-anchor="middle">kept in Drive</text>

  <path class="ln" d="M230 185H296"/><text class="l" x="263" y="176" text-anchor="middle">1</text>
  <path class="ln" d="M400 262V326"/><text class="l" x="414" y="300">2</text>
  <path class="ln" d="M502 390C540 390 545 330 576 330"/><text class="l" x="508" y="418">3 upload audio</text>
  <path class="ln" d="M690 198V170"/><path class="ln" d="M730 170V198"/><text class="l" x="742" y="190">4</text>
  <path class="ln" d="M832 300H886"/><text class="l" x="844" y="290">5 search</text>
  <path class="ln" d="M298 420H234"/><text class="l" x="242" y="410">6</text>
</svg>
