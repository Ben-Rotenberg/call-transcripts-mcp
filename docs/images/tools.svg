<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs><style>.c{fill:#fff;stroke:#E2E8F0;stroke-width:2}.n{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;font-weight:700;fill:#6D28D9}.d{font-size:13.5px;fill:#334155}.e{font-size:12.5px;fill:#64748B;font-style:italic}</style></defs>
  <rect width="1100" height="300" rx="24" fill="#F5F3FF"/>
  <text x="40" y="48" font-size="23" font-weight="800" fill="#0F172A">Five tools Claude gets</text>
  <g transform="translate(40,72)"><rect class="c" width="190" height="196" rx="16"/><text x="18" y="38" font-size="26">🔎</text><text class="n" x="18" y="72">search_calls</text><text class="d" x="18" y="100">Full-text search in</text><text class="d" x="18" y="118">every transcript</text><text class="e" x="18" y="160">"Who mentioned</text><text class="e" x="18" y="177">the invoice?"</text></g>
  <g transform="translate(250,72)"><rect class="c" width="190" height="196" rx="16"/><text x="18" y="38" font-size="26">📋</text><text class="n" x="18" y="72">list_calls</text><text class="d" x="18" y="100">Browse by date,</text><text class="d" x="18" y="118">contact or number</text><text class="e" x="18" y="160">"My calls from</text><text class="e" x="18" y="177">yesterday"</text></g>
  <g transform="translate(460,72)"><rect class="c" width="190" height="196" rx="16"/><text x="18" y="38" font-size="26">📄</text><text class="n" x="18" y="72">get_transcript</text><text class="d" x="18" y="100">Full text of</text><text class="d" x="18" y="118">one call</text><text class="e" x="18" y="160">"Summarise</text><text class="e" x="18" y="177">call #42"</text></g>
  <g transform="translate(670,72)"><rect class="c" width="190" height="196" rx="16"/><text x="18" y="38" font-size="26">📊</text><text class="n" x="18" y="72">sync_status</text><text class="d" x="18" y="100">Queue, errors and</text><text class="d" x="18" y="118">billing alerts</text><text class="e" x="18" y="160">"Is everything</text><text class="e" x="18" y="177">transcribing?"</text></g>
  <g transform="translate(880,72)"><rect class="c" width="180" height="196" rx="16"/><text x="18" y="38" font-size="26">⚡</text><text class="n" x="18" y="72">sync_now</text><text class="d" x="18" y="100">Transcribe now or</text><text class="d" x="18" y="118">retry a failed call</text><text class="e" x="18" y="160">"Retry call #17"</text></g>
</svg>
