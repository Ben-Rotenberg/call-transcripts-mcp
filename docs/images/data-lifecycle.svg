<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs><style>.t{font-size:17px;font-weight:800;fill:#0F172A}.s{font-size:13.5px;fill:#475569}.k{font-size:12px;font-weight:800;letter-spacing:.06em}</style></defs>
  <rect width="1100" height="430" rx="24" fill="#F8FAFC"/>
  <text x="40" y="50" font-size="23" font-weight="800" fill="#0F172A">Where your data lives, and for how long</text>
  <text x="40" y="76" font-size="14.5" fill="#64748B">Everything runs in accounts you own. The only third party that sees audio is OpenAI, for transcription.</text>
  <!-- timeline axis -->
  <line x1="60" y1="380" x2="1050" y2="380" stroke="#CBD5E1" stroke-width="3"/>
  <g font-size="12.5" fill="#64748B" text-anchor="middle">
    <circle cx="80" cy="380" r="6" fill="#7C3AED"/><text x="80" y="405">call ends</text>
    <circle cx="270" cy="380" r="5" fill="#94A3B8"/><text x="270" y="405">~10 min</text>
    <circle cx="470" cy="380" r="5" fill="#94A3B8"/><text x="470" y="405">7 days</text>
    <circle cx="760" cy="380" r="5" fill="#94A3B8"/><text x="760" y="405">120 days</text>
    <text x="1020" y="405">forever</text>
  </g>
  <!-- bars -->
  <rect x="80" y="110" width="970" height="46" rx="12" fill="#DBEAFE"/>
  <text class="k" x="96" y="130" fill="#1D4ED8">YOUR GOOGLE DRIVE</text><text class="s" x="96" y="148">Original recordings + .json metadata (Cube ACR folder). You decide when to delete.</text>
  <rect x="80" y="168" width="390" height="46" rx="12" fill="#FFEDD5"/>
  <text class="k" x="96" y="188" fill="#C2410C">CLOUDFLARE KV</text><text class="s" x="96" y="206">Audio copy, deleted right after transcription (max 7 days).</text>
  <rect x="80" y="226" width="680" height="46" rx="12" fill="#FCE7F3"/>
  <text class="k" x="96" y="246" fill="#BE185D">CLOUDFLARE D1</text><text class="s" x="96" y="264">Searchable transcript, name and number. Wiped after RETENTION_DAYS (default 120).</text>
  <rect x="270" y="284" width="780" height="46" rx="12" fill="#E0E7FF"/>
  <text class="k" x="286" y="304" fill="#4338CA">YOUR GOOGLE DRIVE</text><text class="s" x="286" y="322">"Cube ACR Transcripts" folder: one Markdown file per call, kept until you delete it.</text>
  <rect x="80" y="340" width="190" height="22" rx="8" fill="#DCFCE7"/>
  <text x="90" y="356" font-size="12" fill="#15803D" font-weight="700">OpenAI: transcribes the audio*</text>
  <text x="1050" y="356" font-size="11.5" fill="#94A3B8" text-anchor="end">* subject to OpenAI's API data-retention policy</text>
</svg>
